<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Inquiries Dashboard — NIA 1.0 & NDTechHub</title>
  <link rel="icon" type="image/x-icon" href="assets/images/nia_icon.ico">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="bg-brandDark text-slate-200 min-h-screen flex flex-col justify-between font-sans antialiased">
  
  <header class="border-b border-white/10 glassmorphism sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <span class="w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></span>
        <h1 class="text-base font-bold text-white font-mono">NDTechHub • Inquiries Inbox</h1>
      </div>
      <a href="/" class="text-xs text-slate-400 hover:text-white transition flex items-center space-x-1 font-mono">
        <i class="fa-solid fa-arrow-left"></i>
        <span>Back to Site</span>
      </a>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-6 py-10 flex-1 w-full">
    <!-- Key Auth Screen (if key not in URL) -->
    <div id="auth-panel" class="max-w-md mx-auto p-8 rounded-3xl glassmorphism-card border border-cyan-500/30 text-center space-y-4">
      <div class="w-12 h-12 rounded-2xl bg-cyan-500/10 text-accentCyan flex items-center justify-center text-xl mx-auto">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h2 class="text-xl font-bold text-white">Admin Authentication</h2>
      <p class="text-xs text-slate-400">Enter your Admin Secret Key to view received customer inquiries.</p>
      <form id="auth-form" class="space-y-3 pt-2">
        <input type="password" id="admin-key-input" placeholder="Admin Secret Key" required class="w-full px-4 py-2.5 rounded-xl bg-black/60 border border-white/10 text-white text-xs font-mono focus:border-accentCyan focus:outline-none" />
        <button type="submit" class="w-full py-2.5 rounded-xl bg-gradient-to-r from-cyan-400 to-cyan-500 text-black font-bold text-xs hover:opacity-95 transition glow-cyan">
          Access Inquiries Inbox
        </button>
      </form>
    </div>

    <!-- Inquiries List -->
    <div id="inbox-panel" class="hidden space-y-6">
      <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 pb-4 border-b border-white/10">
        <div>
          <h2 class="text-2xl font-black text-white">Received Messages</h2>
          <p class="text-xs text-slate-400 mt-1">Real-time log of customer messages submitted via the website contact form.</p>
        </div>
        <div class="flex items-center space-x-3 font-mono text-xs">
          <span class="px-3 py-1.5 rounded-xl bg-cyan-500/10 border border-cyan-500/30 text-accentCyan font-bold" id="inquiry-count">0 Inquiries</span>
          <button id="refresh-btn" class="px-3 py-1.5 rounded-xl bg-white/5 border border-white/10 text-slate-300 hover:text-white transition">
            <i class="fa-solid fa-arrows-rotate mr-1"></i> Refresh
          </button>
        </div>
      </div>

      <div id="inbox-container" class="space-y-4">
        <!-- Inquiries injected via JS -->
      </div>
    </div>
  </main>

  <footer class="border-t border-white/10 py-6 text-center text-xs text-slate-500 font-mono">
    NDTechHub & NAVDIVA Group Private Admin Console
  </footer>

  <script>
    const authPanel = document.getElementById('auth-panel');
    const inboxPanel = document.getElementById('inbox-panel');
    const authForm = document.getElementById('auth-form');
    const adminKeyInput = document.getElementById('admin-key-input');
    const inboxContainer = document.getElementById('inbox-container');
    const inquiryCount = document.getElementById('inquiry-count');
    const refreshBtn = document.getElementById('refresh-btn');

    const urlParams = new URLSearchParams(window.location.search);
    let activeKey = urlParams.get('key') || sessionStorage.getItem('nd_admin_key') || '';

    async function loadInquiries(key) {
      try {
        const res = await fetch(`/api/admin/contacts?secret=${encodeURIComponent(key)}`);
        if (res.status === 401) {
          authPanel.classList.remove('hidden');
          inboxPanel.classList.add('hidden');
          return;
        }
        const data = await res.json();
        sessionStorage.setItem('nd_admin_key', key);
        authPanel.classList.add('hidden');
        inboxPanel.classList.remove('hidden');

        const items = Object.values(data.contacts || {}).reverse();
        inquiryCount.textContent = `${items.length} Inquiries`;

        if (items.length === 0) {
          inboxContainer.innerHTML = `
            <div class="p-12 text-center rounded-3xl glassmorphism border border-white/5 space-y-3">
              <i class="fa-regular fa-envelope-open text-4xl text-slate-600"></i>
              <p class="text-sm text-slate-400">No customer messages received yet.</p>
              <p class="text-xs text-slate-500">When someone submits your Contact Form, it will appear here instantly.</p>
            </div>
          `;
          return;
        }

        inboxContainer.innerHTML = items.map(item => `
          <div class="p-6 rounded-2xl glassmorphism-card border border-white/10 space-y-3">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-white/5 pb-3">
              <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl bg-cyan-500/10 text-accentCyan flex items-center justify-center font-bold font-mono text-sm">
                  ${(item.name || 'U').charAt(0).toUpperCase()}
                </div>
                <div>
                  <h3 class="text-sm font-bold text-white">${item.name || 'Anonymous'}</h3>
                  <a href="mailto:${item.email}" class="text-xs text-accentCyan hover:underline font-mono">${item.email}</a>
                </div>
              </div>
              <div class="flex items-center space-x-2 font-mono text-xs">
                <span class="px-2.5 py-1 rounded-md bg-purple-500/10 border border-purple-500/30 text-purple-300 uppercase">${item.inquiry_type || 'General'}</span>
                <span class="text-slate-500 text-[11px]">${new Date(item.created_at).toLocaleString()}</span>
              </div>
            </div>
            <div>
              <div class="text-xs font-bold text-slate-300 mb-1"><span class="text-slate-500 font-mono">Subject:</span> ${item.subject || 'No Subject'}</div>
              <div class="text-xs text-slate-300 bg-black/40 p-3 rounded-xl border border-white/5 whitespace-pre-wrap leading-relaxed">${item.message || ''}</div>
            </div>
            <div class="pt-2 flex justify-end">
              <a href="mailto:${item.email}?subject=Re: ${encodeURIComponent(item.subject || 'Inquiry regarding NIA 1.0')}" class="inline-flex items-center space-x-1.5 px-3 py-1.5 rounded-lg bg-cyan-500/10 hover:bg-cyan-500/20 text-accentCyan text-xs font-mono font-bold transition border border-cyan-500/30">
                <i class="fa-solid fa-reply"></i>
                <span>Reply via Email</span>
              </a>
            </div>
          </div>
        `).join('');

      } catch (err) {
        alert("Failed to connect to server: " + err.message);
      }
    }

    if (activeKey) {
      loadInquiries(activeKey);
    }

    authForm.addEventListener('submit', (e) => {
      e.preventDefault();
      activeKey = adminKeyInput.value.trim();
      loadInquiries(activeKey);
    });

    refreshBtn.addEventListener('click', () => {
      if (activeKey) loadInquiries(activeKey);
    });
  </script>
</body>
</html>
