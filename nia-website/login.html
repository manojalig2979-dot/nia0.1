<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NIA Sovereign Desktop AI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #030409; /* Deep space black */
            color: #ffffff;
            margin: 0;
            overflow-x: hidden;
        }
        h1, h2, h3, h4, h5, h6, .space-font {
            font-family: 'Space Grotesk', sans-serif;
        }
        .bg-glass {
            background: rgba(15, 20, 40, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(61, 142, 248, 0.2);
        }
        .input-glass {
            background: rgba(10, 15, 30, 0.5);
            border: 1px solid rgba(61, 142, 248, 0.3);
            color: #fff;
        }
        .input-glass:focus {
            outline: none;
            border-color: #3d8ef8;
            box-shadow: 0 0 10px rgba(61, 142, 248, 0.3);
        }
        .btn-primary {
            background: linear-gradient(90deg, #3d8ef8, #1230a0);
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(61, 142, 248, 0.4);
        }
        .btn-google {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .btn-google:hover {
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center relative">
    
    <!-- Background Effects -->
    <div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
        <div class="absolute top-[20%] left-[20%] w-[500px] h-[500px] bg-blue-600/10 rounded-full blur-[100px]"></div>
        <div class="absolute bottom-[20%] right-[20%] w-[400px] h-[400px] bg-cyan-400/10 rounded-full blur-[100px]"></div>
    </div>

    <!-- Nav Return -->
    <a href="index.html" class="absolute top-8 left-8 text-gray-400 hover:text-white transition flex items-center gap-2 z-10">
        <i class="fas fa-arrow-left"></i> Back to Home
    </a>

    <!-- Login Container -->
    <div class="w-full max-w-md bg-glass rounded-2xl p-8 z-10 mx-4">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-300 tracking-tight" id="form-title">Sign in to NIA</h1>
            <p class="text-gray-400 mt-2 text-sm">Access your licenses and purchase history</p>
        </div>

        <div id="auth-error" class="hidden mb-4 p-3 bg-red-500/20 border border-red-500/50 rounded text-red-400 text-sm text-center"></div>

        <form id="login-form" class="space-y-5">
            <div>
                <label class="block text-gray-400 text-sm font-medium mb-1">Email Address</label>
                <input type="email" id="email" required class="w-full px-4 py-3 rounded-lg input-glass focus:ring-2 focus:ring-blue-500/50" placeholder="you@example.com">
            </div>
            <div>
                <label class="block text-gray-400 text-sm font-medium mb-1">Password</label>
                <input type="password" id="password" required class="w-full px-4 py-3 rounded-lg input-glass focus:ring-2 focus:ring-blue-500/50" placeholder="••••••••">
            </div>
            
            <button type="submit" id="submit-btn" class="w-full py-3 rounded-lg btn-primary text-white font-semibold shadow-lg shadow-blue-500/25">
                Sign In
            </button>
        </form>

        <div class="mt-6 flex items-center justify-between">
            <hr class="w-full border-gray-700">
            <span class="px-3 text-gray-500 text-sm">or</span>
            <hr class="w-full border-gray-700">
        </div>

        <button id="google-login-btn" class="mt-6 w-full py-3 rounded-lg btn-google flex items-center justify-center gap-3 text-white font-medium">
            <i class="fab fa-google text-red-400"></i> Continue with Google
        </button>

        <p class="text-center mt-8 text-gray-400 text-sm">
            <a href="#" id="toggle-mode" class="hover:text-white transition">Don't have an account? <b>Sign up</b></a>
        </p>
    </div>

    <script type="module" src="assets/js/firebase-config.js"></script>
    <script type="module" src="assets/js/auth.js"></script>
</body>
</html>
